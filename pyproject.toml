# pyproject.toml
# Modern Python packaging (PEP 517/518/660).
# Replaces setup.py + requirements.txt — single source of truth.
#
# Install the project:
#   pip install -e .           # editable, no extras
#   pip install -e ".[dev]"    # + dev/test dependencies

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "cifar100-vgg16-project"
version     = "0.1.0"
description = "CIFAR-100 classification with VGG16: hierarchical loss, SupCon pretraining, and iterative filter pruning"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }

authors = [
    { name = "Andrii Vynnytskyi" },
]

# ---------- Core runtime dependencies ----------
# Limited to what code currently in this repo (src/ + notebooks/) actually
# imports. Do not add hydra-core, omegaconf, wandb, scikit-learn, or tqdm back
# here until code that imports them exists — configs/train.yaml and the README
# describe an intended future workflow using some of these, but nothing in the
# repo imports them yet.
dependencies = [
    "torch==2.9.0",
    "torchvision",     # imported in src/train.py; left unpinned deliberately so
                        # it resolves against the installed torch build.
    "matplotlib==3.10.7",
    "numpy==1.26.4",
]

# ---------- Optional extras ----------
[project.optional-dependencies]
# pytest, ruff, mypy, and pre-commit are configured below / in
# .pre-commit-config.yaml, but no test or lint run has been made against this
# repo yet, so they are left unpinned rather than pinned to a guessed version.
dev = [
    "pytest",           # unpinned: see note above
    "pytest-cov",       # unpinned: see note above
    "ruff",             # unpinned: see note above
    "mypy",             # unpinned: see note above
    "pre-commit",       # unpinned: see note above
    "ipykernel==7.0.1",
]

# ---------- Package discovery ----------
# Without this, setuptools' auto-discovery does not reliably register `src` as an
# importable package — `pip install -e .` can succeed while `import src` still
# fails. Being explicit makes `from src.model import ...` work everywhere,
# independent of the caller's working directory.
[tool.setuptools.packages.find]
include = ["src*"]

# ---------- Tooling configuration ----------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]   # pycodestyle, pyflakes, isort, pyupgrade, naming, annotations
ignore = ["ANN101", "ANN102"]                  # ignore self/cls annotations

[tool.mypy]
python_version       = "3.10"
strict               = true
ignore_missing_imports = true
disable_error_code     = ["type-arg", "no-any-return", "no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --cov=src --cov-report=term-missing"
